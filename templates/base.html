<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>{% block title %}Placement Portal{% endblock %}</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
        }

        .navbar-custom {
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(10px);
        }

        footer {
            background: #020617;
            color: #94a3b8;
        }
    </style>

</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-5">
        <div class="container-fluid">

            <a class="navbar-brand text-info fw-bold" href="/">Placement Portal</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="nav">
                <ul class="navbar-nav align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    {% if session.get('user_id') %}
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-info ms-3" href="/register">Register</a>
                    </li>
                    {% endif %}

                </ul>
            </div>

        </div>
    </nav>


    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>


    <footer class="text-center py-3 mt-auto">
        © 2026 Placement Portal | All Rights Reserved
    </footer>

</body>

</html>
