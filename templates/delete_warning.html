{% extends "base.html" %}

{% block title %}Delete Warning{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card bg-dark text-light border-danger p-4 text-center" style="max-width: 500px; width: 100%;">

        <h3 class="text-danger mb-3">⚠ Warning</h3>

        <p>
            This job has
            <span class="fw-bold text-warning">{{ application_count }}</span>
            application(s).
        </p>

        <p class="text-secondary">
            If you delete this job, all applications will also be removed.
        </p>

        <div class="d-flex justify-content-center gap-3 mt-4">

            <form action="/confirm-delete/{{ job.id }}" method="POST">
                <button type="submit" class="btn btn-danger">
                    Yes, Delete Anyway
                </button>
            </form>

            <a href="/company_dashboard" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </div>

</div>

{% endblock %}
