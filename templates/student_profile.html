{% extends "base.html" %}

{% block title %}Student Profile{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card bg-dark text-light border-secondary p-4" style="max-width: 500px; width: 100%;">

        <h3 class="text-center mb-4">Student Profile</h3>

        <form action="/student_profile" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <input type="text" name="department" class="form-control" placeholder="Department" required>
            </div>

            <div class="mb-3">
                <input type="number" step="0.01" name="cgpa" class="form-control" placeholder="CGPA" required>
            </div>

            <div class="mb-3">
                <input type="text" name="skills" class="form-control" placeholder="Skills" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Resume</label>
                <input type="file" name="resume" class="form-control">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-info">Save Profile</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
