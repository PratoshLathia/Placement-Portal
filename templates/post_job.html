{% extends "base.html" %}

{% block title %}Post Job{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card bg-dark text-light border-secondary p-4" style="max-width: 600px; width: 100%;">

        <h3 class="text-center mb-4">Post New Job</h3>

        <form action="/post-job" method="POST">

            <div class="mb-3">
                <input type="text" name="title" class="form-control" placeholder="Job Title" required>
            </div>

            <div class="mb-3">
                <textarea name="description" class="form-control" rows="4" placeholder="Job Description"></textarea>
            </div>

            <div class="mb-3">
                <input type="text" name="skills" class="form-control" placeholder="Required Skills" required>
            </div>

            <div class="mb-3">
                <input type="text" name="experience" class="form-control" placeholder="Experience" required>
            </div>

            <div class="mb-3">
                <input type="text" name="salary" class="form-control" placeholder="Salary" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">Post Job</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
